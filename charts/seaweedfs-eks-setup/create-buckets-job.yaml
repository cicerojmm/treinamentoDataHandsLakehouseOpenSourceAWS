# Cria os buckets do lakehouse no SeaweedFS (EKS) (idempotente). Lista de
# buckets vem do ConfigMap seaweedfs-setup-config (kustomization.yaml).
# Mesmo padrao do minio-create-buckets: aws-cli contra o endpoint S3.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-create-buckets
  namespace: data-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-seaweedfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z seaweedfs-s3.data-platform.svc.cluster.local 8333; do
                echo "aguardando SeaweedFS S3..."; sleep 5
              done
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.17.40
          env:
            - name: AWS_ACCESS_KEY_ID
              value: QAz5JwVWRuiRMn4zPzhR
            - name: AWS_SECRET_ACCESS_KEY
              value: gUO58cxmoFJDzE8AutXkeLsX09wg4NZ1eP3QqqYq
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ENDPOINT=http://seaweedfs-s3.data-platform.svc.cluster.local:8333
              for b in $(cat /config/buckets); do
                aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$b" 2>/dev/null \
                  && echo "bucket $b ja existe" \
                  || aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$b"
              done
              aws --endpoint-url "$ENDPOINT" s3 ls
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: seaweedfs-setup-config
