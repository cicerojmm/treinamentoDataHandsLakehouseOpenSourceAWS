apiVersion: v1
kind: Secret
metadata:
  name: airbyte-postgres-secret
  namespace: ingestion
type: Opaque
stringData:
  POSTGRES_USER: airbyte
  POSTGRES_PASSWORD: airbyte123
  POSTGRES_DB: airbyte
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airbyte-postgres-pvc
  namespace: ingestion
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-postgres
  namespace: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte-postgres
  template:
    metadata:
      labels:
        app: airbyte-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: airbyte-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airbyte-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-postgres
  namespace: ingestion
spec:
  selector:
    app: airbyte-postgres
  ports:
    - port: 5432
      targetPort: 5432
