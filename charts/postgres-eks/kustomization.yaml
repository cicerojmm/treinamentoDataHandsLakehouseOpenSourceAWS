apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - airflow-postgres.yaml
  - airbyte-postgres.yaml
  - hive-metastore-postgres.yaml
  - sample-source-postgres.yaml
  - openmetadata-postgres.yaml
  - openmetadata-airflow-postgres.yaml
  - iceberg-catalog-init-job.yaml

# Dados Movielens carregados no primeiro start do sample source (PVC vazio)
configMapGenerator:
  - name: sample-source-initdb
    namespace: ingestion
    files:
      - sample-data/01-movielens-schema.sql
      - sample-data/02-movielens-data.sql

generatorOptions:
  disableNameSuffixHash: true
