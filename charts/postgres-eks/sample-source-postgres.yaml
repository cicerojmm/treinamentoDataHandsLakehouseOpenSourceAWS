apiVersion: v1
kind: Secret
metadata:
  name: sample-source-postgres-secret
  namespace: ingestion
type: Opaque
stringData:
  POSTGRES_USER: sample
  POSTGRES_PASSWORD: sample123
  POSTGRES_DB: movielens
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sample-source-postgres-pvc
  namespace: ingestion
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-source-postgres
  namespace: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-source-postgres
  template:
    metadata:
      labels:
        app: sample-source-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: sample-source-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sample-source-postgres-pvc
        - name: initdb
          configMap:
            name: sample-source-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: sample-source-postgres
  namespace: ingestion
spec:
  selector:
    app: sample-source-postgres
  ports:
    - port: 5432
      targetPort: 5432
