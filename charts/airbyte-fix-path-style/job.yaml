# Corrige um bug do chart Airbyte (templates/env-configmap.yaml): com
# global.storage.type=s3, S3_PATH_STYLE_ACCESS fica sempre vazio (o
# chart so' seta "true" quando type=="minio", que por sua vez forca um
# StatefulSet MinIO interno indesejado — ver comentario em
# apps/eks/airbyte-app.yaml). Sem path-style, o client Java do Airbyte
# nao consegue falar com o MinIO (endereçamento virtual-hosted-style
# nao suportado, sem DNS wildcard), causando erro 500 ao testar/rodar
# conexoes (S3Exception "region is wrong" ao buscar logs do job).
#
# Corrige com um patch direto no ConfigMap + restart dos deployments
# que leem essa env var, apos o Airbyte estar sincronizado.
apiVersion: batch/v1
kind: Job
metadata:
  name: airbyte-fix-path-style
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: airbyte-fix-path-style
      restartPolicy: OnFailure
      containers:
        - name: fix
          image: bitnami/kubectl:1.30
          command:
            - sh
            - -c
            - |
              set -e
              kubectl patch configmap airbyte-airbyte-env \
                --type merge -p '{"data":{"S3_PATH_STYLE_ACCESS":"true"}}'
              kubectl rollout restart deployment/airbyte-server
              kubectl rollout restart deployment/airbyte-worker
              echo "S3_PATH_STYLE_ACCESS corrigido e deployments reiniciados."
