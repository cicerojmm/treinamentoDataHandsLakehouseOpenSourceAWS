# OpenSearch values for local environment

singleNode: true
replicas: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

persistence:
  enabled: true
  size: 10Gi

config:
  opensearch.yml: |
    cluster.name: openmetadata-cluster
    network.host: 0.0.0.0
    plugins.security.disabled: true

extraEnvs:
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"
