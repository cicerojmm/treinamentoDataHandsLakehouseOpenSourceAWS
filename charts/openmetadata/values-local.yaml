# OpenMetadata values for local environment

openmetadata:
  config:
    authentication:
      provider: basic
    database:
      host: openmetadata-postgres.governance.svc.cluster.local
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata
      auth:
        username: openmetadata
        password:
          secretRef: openmetadata-postgres-secret
          secretKey: POSTGRES_PASSWORD
    elasticsearch:
      host: opensearch-cluster-master.governance.svc.cluster.local
      port: 9200
      scheme: http
    # Nao usamos o subchart openmetadata-dependencies (Airflow proprio do
    # OpenMetadata) — ingestion pipelines geridas manualmente via UI/API.
    # O client ainda exige um secret configurado para o server subir; o
    # endpoint nunca e de fato chamado enquanto nenhuma pipeline usa-lo.
    pipelineServiceClientConfig:
      auth:
        password:
          secretRef: airflow-secrets
          secretKey: openmetadata-airflow-password

ingress:
  enabled: false

postgresql:
  enabled: false

elasticsearch:
  enabled: false
