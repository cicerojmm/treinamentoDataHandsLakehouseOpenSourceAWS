# Overrides do OpenMetadata para EKS (aplicado sobre values-local.yaml)

# Medido em carga (2026-09-23): ~1,27Gi (JVM). Sem request o scheduler do
# k8s o empilhava em node ja cheio e o node travava por memoria.
resources:
  requests:
    cpu: 20m
    memory: 1400Mi
  limits:
    memory: 2Gi

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
