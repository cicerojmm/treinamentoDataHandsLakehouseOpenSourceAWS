apiVersion: v1
kind: Secret
metadata:
  name: metabase-postgres-secret
  namespace: data-platform
type: Opaque
stringData:
  POSTGRES_USER: metabase
  POSTGRES_PASSWORD: metabase123
  POSTGRES_DB: metabase
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-postgres-pvc
  namespace: data-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase-postgres
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase-postgres
  template:
    metadata:
      labels:
        app: metabase-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: metabase-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: metabase-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: metabase-postgres
  namespace: data-platform
spec:
  selector:
    app: metabase-postgres
  ports:
    - port: 5432
      targetPort: 5432
