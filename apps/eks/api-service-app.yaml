apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakehouse-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cicerojmm/treinamentoDataHandsLakehouseOpenSourceAWS
    targetRevision: HEAD
    path: code/api-service/k8s-eks
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
