apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  sources:
    - repoURL: https://helm.open-metadata.org
      chart: openmetadata
      targetRevision: 1.5.4
      helm:
        valueFiles:
          - $values/charts/openmetadata/values-local.yaml
          - $values/charts/openmetadata/values-eks.yaml
    - repoURL: https://github.com/cicerojmm/treinamentoDataHandsLakehouseOpenSourceAWS
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: governance
  # O chart gera openmetadata-db-secret com valor aleatorio a cada render,
  # o que causa OutOfSync permanente mesmo sem mudanca real (nao usamos
  # esse secret: senha do postgres vem de openmetadata-postgres-secret,
  # ver values-local.yaml).
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: openmetadata-db-secret
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
