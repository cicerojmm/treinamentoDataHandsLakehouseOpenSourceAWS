apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/cicerojmm/treinamentoDataHandsLakehouseOpenSourceAWS
    targetRevision: HEAD
    path: charts/airbyte-eks
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
