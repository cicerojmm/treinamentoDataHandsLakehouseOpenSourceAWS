apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-metastore-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.38
    helm:
      values: |
        fullnameOverride: hive-metastore-postgres
        image:
          tag: 16.3.0-debian-12-r23
        auth:
          database: metastore
          username: hive
          password: hive123
        primary:
          persistence:
            size: 10Gi
            storageClass: gp3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
