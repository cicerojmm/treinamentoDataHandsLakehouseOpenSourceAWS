apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-tenant
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://operator.min.io
    chart: tenant
    targetRevision: 6.0.4
    helm:
      values: |
        tenant:
          name: minio-eks
          pools:
            - servers: 1
              name: pool-0
              volumesPerServer: 1
              size: 50Gi
              storageClassName: gp3
              # Medido em carga (2026-09-23): pico 167Mi, ~11m cpu.
              resources:
                requests:
                  cpu: 10m
                  memory: 256Mi
                limits:
                  memory: 768Mi
          mountPath: /data
          certificate:
            requestAutoCert: false
          prometheusOperator: false
          env:
            - name: MINIO_BROWSER
              value: "on"
          configSecret:
            name: minio-eks-env-configuration
          configuration:
            name: minio-eks-env-configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
