apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://airbytehq.github.io/helm-charts
    chart: airbyte
    targetRevision: 1.7.8
    helm:
      skipCrds: true
      parameters:
        - name: server.livenessProbe.initialDelaySeconds
          value: "120"
        - name: server.livenessProbe.periodSeconds
          value: "15"
        - name: server.livenessProbe.failureThreshold
          value: "5"
        - name: server.readinessProbe.initialDelaySeconds
          value: "60"
        - name: server.readinessProbe.periodSeconds
          value: "10"
        - name: server.readinessProbe.failureThreshold
          value: "5"
      values: |
        global:
          database:
            host: airbyte-postgres.ingestion.svc.cluster.local
            port: 5432
            database: airbyte
            user: airbyte
            password: airbyte123
          # type: minio (igual ao local). NAO usar type: s3: o chart nao
          # injeta endpoint nenhum nesse modo e o SDK vai pra AWS S3
          # publica — onde existe um bucket "airbyte-storage" de outra
          # conta em eu-west-1 (erro 500: "region 'us-east-1' is wrong;
          # expecting 'eu-west-1'"). Com type: minio o chart seta
          # MINIO_ENDPOINT e S3_PATH_STYLE_ACCESS=true sozinho.
          # JOB_MAIN_CONTAINER_*_REQUEST sobrescreve todas as variantes de
          # recurso do airbyte-server (sem isso, sync de source de banco
          # pede orchestrator 2 CPU/2Gi + source 1 + destination 1 = 4 CPU,
          # e o pod de replicacao nunca agenda em t3.large). Precisa ser
          # string aqui: via helm "parameters" o "0" vira int 0 e o chart
          # renderiza vazio.
          jobs:
            resources:
              requests:
                cpu: "0"
                memory: "256Mi"

          storage:
            type: minio
            storageSecretName: airbyte-storage-secret
            bucket:
              log: airbyte-storage
              state: airbyte-storage
              workloadOutput: airbyte-storage
            minio:
              endpoint: http://minio-eks-hl.data-platform.svc.cluster.local:9000
              accessKeyIdSecretKey: AWS_ACCESS_KEY_ID
              secretAccessKeySecretKey: AWS_SECRET_ACCESS_KEY

        webapp:
          enabled: true
          replicaCount: 1
          service:
            type: LoadBalancer
            port: 8001
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        server:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        temporal:
          enabled: true
          replicaCount: 1

        postgresql:
          enabled: false

        # Com type: minio o chart sempre cria um StatefulSet airbyte-minio
        # (hook pre-install, sem toggle — "enabled" e' ignorado). Fica
        # ocioso; o Airbyte usa o MinIO da plataforma. A tag default foi
        # removida do Docker Hub (causava ErrImagePull), por isso quay.io.
        # Mesma tag do chart porque o pod airbyte-minio-create-bucket usa
        # essa imagem com "mc policy set" (comando antigo).
        minio:
          image:
            repository: quay.io/minio/minio
            tag: RELEASE.2023-11-20T22-40-07Z

        airbyteBootloader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  # Nao usar ignoreDifferences + RespectIgnoreDifferences=true aqui: o
  # ArgoCD deixa de podar/atualizar recursos que batem na regra
  # (ConfigMap airbyte-airbyte-env ficava com valores antigos).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
