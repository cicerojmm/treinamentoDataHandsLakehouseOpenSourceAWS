apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://airbytehq.github.io/helm-charts
    chart: airbyte
    targetRevision: 1.7.8
    helm:
      skipCrds: true
      parameters:
        - name: global.jobs.resources.requests.cpu
          value: "0"
        - name: global.jobs.resources.requests.memory
          value: "0"
        - name: server.livenessProbe.initialDelaySeconds
          value: "120"
        - name: server.livenessProbe.periodSeconds
          value: "15"
        - name: server.livenessProbe.failureThreshold
          value: "5"
        - name: server.readinessProbe.initialDelaySeconds
          value: "60"
        - name: server.readinessProbe.periodSeconds
          value: "10"
        - name: server.readinessProbe.failureThreshold
          value: "5"
      values: |
        global:
          database:
            host: airbyte-postgres.ingestion.svc.cluster.local
            port: 5432
            database: airbyte
            user: airbyte
            password: airbyte123
          # type: s3 (nao "minio"): com type: minio o chart cria
          # INCONDICIONALMENTE um StatefulSet airbyte-minio via hook
          # pre-install (templates/minio.yaml: {{- if eq storage.type
          # "minio" }}, sem toggle pra desativar) — deploy indesejado
          # (decisao do projeto e' MinIO externo, ver SPEC-006) que
          # travou o sync em ErrImagePull.
          #
          # PASSO MANUAL NECESSARIO apos qualquer sync inicial deste
          # app (cluster novo, ou selfHeal apos editar este arquivo):
          # com type: s3 o chart SEMPRE renderiza S3_PATH_STYLE_ACCESS
          # vazio (_helpers.tpl:s3PathStyleAccess so seta "true" quando
          # type=="minio" — nao da pra sobrescrever via values). Sem
          # path-style, o client Java do Airbyte nao fala com o MinIO
          # (sem DNS wildcard pra virtual-hosted-style), causando 500
          # ao testar/rodar qualquer source. Corrigir com:
          #   kubectl patch configmap airbyte-airbyte-env -n ingestion \
          #     --type merge -p '{"data":{"S3_PATH_STYLE_ACCESS":"true"}}'
          #   kubectl rollout restart deployment/airbyte-server \
          #     deployment/airbyte-worker -n ingestion
          # Ja tentamos automatizar isso via Job (PostSync hook) mas o
          # ArgoCD deste cluster mostrou renders inconsistentes/
          # desatualizados especificamente pra esse Job (imagem antiga
          # presa mesmo apos varios refresh/delete+recreate) — nao
          # resolvido, abandonado por ora. Ver git log deste arquivo
          # para o historico da investigacao.
          storage:
            type: s3
            storageSecretName: airbyte-storage-secret
            bucket:
              log: airbyte-storage
              state: airbyte-storage
              workloadOutput: airbyte-storage
            s3:
              region: "us-east-1"
              authenticationType: credentials

        webapp:
          enabled: true
          replicaCount: 1
          service:
            type: LoadBalancer
            port: 8001
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        server:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        temporal:
          enabled: true
          replicaCount: 1

        postgresql:
          enabled: false

        minio:
          enabled: false

        airbyteBootloader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  # (removido) ignoreDifferences para StatefulSet airbyte-minio +
  # ConfigMap airbyte-airbyte-env/MINIO_ENDPOINT, combinado com
  # RespectIgnoreDifferences=true, era residuo de quando o projeto
  # usava storage.type=minio. Esse combo faz o ArgoCD NUNCA podar
  # recursos que batem numa regra de ignoreDifferences, mesmo quando
  # deixam de fazer parte do estado desejado — e' a causa raiz de
  # airbyte-minio reaparecer repetidamente e do ConfigMap voltando pra
  # valores antigos apos qualquer sync, mesmo com o spec correto
  # (type: s3) confirmado no objeto Application ao vivo.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
