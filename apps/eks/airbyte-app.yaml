apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://airbytehq.github.io/helm-charts
    chart: airbyte
    targetRevision: 1.7.8
    helm:
      skipCrds: true
      parameters:
        - name: global.jobs.resources.requests.cpu
          value: "0"
        - name: global.jobs.resources.requests.memory
          value: "0"
        - name: server.livenessProbe.initialDelaySeconds
          value: "120"
        - name: server.livenessProbe.periodSeconds
          value: "15"
        - name: server.livenessProbe.failureThreshold
          value: "5"
        - name: server.readinessProbe.initialDelaySeconds
          value: "60"
        - name: server.readinessProbe.periodSeconds
          value: "10"
        - name: server.readinessProbe.failureThreshold
          value: "5"
      values: |
        global:
          database:
            host: airbyte-postgres.ingestion.svc.cluster.local
            port: 5432
            database: airbyte
            user: airbyte
            password: airbyte123
          # type: minio (nao "s3"): o template do chart so' seta
          # S3_PATH_STYLE_ACCESS=true quando storage.type=="minio" (ver
          # _helpers.tpl:s3PathStyleAccess). Com type: s3 o client Java
          # tenta virtual-hosted-style contra o MinIO, que nao suporta
          # (sem DNS wildcard), e falha com "S3Exception: ... region
          # 'us-east-1' is wrong; expecting 'eu-west-1'" — reproduzido
          # ao testar a conexao do source Postgres no Airbyte (erro 500
          # ao buscar os logs do check job). Sem storageSecretName: o
          # chart cria seu proprio secret com minio/minio123 (bate com
          # as credenciais reais do tenant).
          storage:
            type: minio
            bucket:
              log: airbyte-storage
              state: airbyte-storage
              workloadOutput: airbyte-storage
            minio:
              endpoint: http://minio-eks-hl.data-platform.svc.cluster.local:9000

        webapp:
          enabled: true
          replicaCount: 1
          service:
            type: LoadBalancer
            port: 8001
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        server:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        temporal:
          enabled: true
          replicaCount: 1

        postgresql:
          enabled: false

        minio:
          enabled: false

        airbyteBootloader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: airbyte-minio
      jsonPointers:
        - /spec
    - group: ""
      kind: ConfigMap
      name: airbyte-airbyte-env
      jsonPointers:
        - /data/MINIO_ENDPOINT
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
