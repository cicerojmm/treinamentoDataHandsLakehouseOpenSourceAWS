apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.22.0
    helm:
      values: |
        executor: KubernetesExecutor

        images:
          airflow:
            repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            tag: v20260921163358
            pullPolicy: Always

        registry:
          secretName: ecr-pull-secret

        postgresql:
          enabled: false

        data:
          metadataConnection:
            user: airflow
            pass: airflow123
            protocol: postgresql
            host: airflow-postgres.ingestion.svc.cluster.local
            port: 5432
            db: airflow

        webserver:
          enabled: false

        apiServer:
          enabled: true
          replicas: 1
          service:
            type: ClusterIP
          startupProbe:
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        triggerer:
          enabled: true
          replicas: 1
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        workers:
          replicas: 0

        createUserJob:
          useHelmHooks: false

        migrateDatabaseJob:
          useHelmHooks: false

        airflowLocalSettings: ""

        config:
          core:
            dags_folder: /opt/airflow/dags
            load_examples: "False"
          kubernetes:
            namespace: ingestion
            worker_container_repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            worker_container_tag: v20260921163358
            delete_worker_pods: "True"
            delete_worker_pods_on_failure: "False"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
