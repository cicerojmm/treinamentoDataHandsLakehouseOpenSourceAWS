apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.22.0
    helm:
      values: |
        executor: KubernetesExecutor

        images:
          airflow:
            repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            tag: v20260921163358
            pullPolicy: Always

        postgresql:
          enabled: false

        # Conexão usada pela DAG dbt_movielens e host do Trino para o dbt (Cosmos)
        env:
          - name: AIRFLOW_CONN_TRINO_DEFAULT
            value: trino://admin@trino.query-engine.svc.cluster.local:8080/
          - name: DBT_TRINO_HOST
            value: trino.query-engine.svc.cluster.local

        data:
          metadataConnection:
            user: airflow
            pass: airflow123
            protocol: postgresql
            host: airflow-postgres.ingestion.svc.cluster.local
            port: 5432
            db: airflow

        webserver:
          enabled: false

        apiServer:
          enabled: true
          replicas: 1
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          startupProbe:
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        scheduler:
          replicas: 1
          # Default startupProbe (6x10s=60s) e o heartbeat do scheduler
          # (~50-55s sob contencao de CPU no sync inicial) ficam no limite
          # um do outro, causando restart loop (CrashLoopBackOff transitorio)
          startupProbe:
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          # 512Mi causou 1x OOMKilled no startup (parse do dbt project via
          # Cosmos e pico de carga com outros componentes subindo juntos)
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        triggerer:
          enabled: true
          replicas: 1
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        workers:
          replicas: 0

        createUserJob:
          useHelmHooks: false

        migrateDatabaseJob:
          useHelmHooks: false

        airflowLocalSettings: ""

        config:
          core:
            dags_folder: /opt/airflow/dags
            load_examples: "False"
          kubernetes:
            namespace: ingestion
            worker_container_repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            worker_container_tag: v20260921163358
            delete_worker_pods: "True"
            delete_worker_pods_on_failure: "False"
          kubernetes_executor:
            # Default 60s: reduz o tempo ate reprocessar tasks presas em
            # "queued" sem pod associado (race entre o watcher de pods do
            # scheduler e delete_worker_pods=True em tasks rapidas).
            worker_pods_queued_check_interval: "20"
          scheduler:
            # Defaults 600s/120s: reduz o tempo ate detectar e resetar
            # tasks travadas em queued/running sem progresso real
            # (observado com o KubernetesExecutor em tasks curtas e
            # paralelas do dbt/Cosmos — sem isso, o self-heal natural
            # podia levar ate 10 min por task presa).
            task_queued_timeout: "300"
            task_queued_timeout_check_interval: "30"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
