apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.22.0
    helm:
      values: |
        executor: KubernetesExecutor

        images:
          airflow:
            repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            tag: 1564abc
            pullPolicy: Always

        postgresql:
          enabled: false

        # Fixos (nao usar apiSecretKey/jwtSecret: ~) — o chart avisa que
        # deixar em branco gera um valor aleatorio a cada helm template,
        # trocando a cada sync do ArgoCD e invalidando sessoes/tokens
        # entre api-server e scheduler (drift real, nao so cosmetico).
        # Estaticos no Git, mesmo padrao das demais credenciais do
        # projeto (ambiente de testes, sem External Secrets).
        apiSecretKey: "airflow-api-secret-2026"
        jwtSecret: "airflow-jwt-secret-2026"

        # Conexão usada pela DAG dbt_movielens e host do Trino para o dbt (Cosmos)
        env:
          - name: AIRFLOW_CONN_TRINO_DEFAULT
            value: trino://admin@trino.query-engine.svc.cluster.local:8080/
          - name: DBT_TRINO_HOST
            value: trino.query-engine.svc.cluster.local

        data:
          metadataConnection:
            user: airflow
            pass: airflow123
            protocol: postgresql
            host: airflow-postgres.ingestion.svc.cluster.local
            port: 5432
            db: airflow

        webserver:
          enabled: false

        apiServer:
          enabled: true
          replicas: 1
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          startupProbe:
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        scheduler:
          replicas: 1
          # Default startupProbe (6x10s=60s) e o heartbeat do scheduler
          # (~50-55s sob contencao de CPU no sync inicial) ficam no limite
          # um do outro, causando restart loop (CrashLoopBackOff transitorio)
          startupProbe:
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          # 512Mi causou 1x OOMKilled no startup (parse do dbt project via
          # Cosmos e pico de carga com outros componentes subindo juntos).
          # Recursos medidos em carga (2026-09-23): memoria = pico medido,
          # cpu = ~metade do p95 (comprimivel). Scheduler: pico 617Mi.
          resources:
            requests:
              cpu: 175m
              memory: 640Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          logGroomerSidecar:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

        # Pico 653Mi e ~470m cpu (reparse do projeto dbt via Cosmos; o
        # intervalo de reparse sobe para 300s em config.dag_processor).
        dagProcessor:
          resources:
            requests:
              cpu: 150m
              memory: 704Mi
            limits:
              memory: 1Gi
          logGroomerSidecar:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

        triggerer:
          enabled: true
          replicas: 1
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          # Pico 470Mi com limit de 512Mi (risco de OOM) e ~380m cpu.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          logGroomerSidecar:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

        statsd:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        # workers.kubernetes.resources = template dos pods de task do
        # KubernetesExecutor (tasks da dbt_movielens: pico 329Mi, ~500m cpu).
        workers:
          replicas: 0
          kubernetes:
            resources:
              requests:
                cpu: 250m
                memory: 384Mi
              limits:
                memory: 768Mi

        # useHelmHooks: true (default do chart) faz o Job virar hook do
        # Helm (helm.sh/hook: post-install,post-upgrade), que o ArgoCD
        # traduz para seu proprio PostSync + hook-delete-policy. Sem
        # isso, com ttlSecondsAfterFinished: 300 (default do chart), o
        # Job se autodestroi e o ArgoCD fica marcando a Application como
        # OutOfSync para sempre por esperar um recurso que nao existe
        # mais (reproduzido: bloqueava make wait-eks indefinidamente).
        createUserJob:
          useHelmHooks: true

        # migrateDatabaseJob como hook Sync do ArgoCD (roda junto com o
        # apply dos manifests):
        # - PostSync (useHelmHooks: true) = deadlock: os pods tem
        #   initContainer wait-for-airflow-migrations e o ArgoCD so
        #   dispara PostSync depois que tudo fica Healthy.
        # - PreSync tambem trava num cluster novo: o Job monta o
        #   ConfigMap airflow-config e le o Secret airflow-metadata, que
        #   so sao criados na fase Sync.
        # BeforeHookCreation evita o erro de campo imutavel do Job.
        migrateDatabaseJob:
          useHelmHooks: false
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

        airflowLocalSettings: ""

        config:
          core:
            dags_folder: /opt/airflow/dags
            load_examples: "False"
          kubernetes:
            namespace: ingestion
            worker_container_repository: 093499160510.dkr.ecr.us-east-2.amazonaws.com/data-platform/airflow-dags
            worker_container_tag: 1564abc
            delete_worker_pods: "True"
            delete_worker_pods_on_failure: "False"
          kubernetes_executor:
            # Default 60s: reduz o tempo ate reprocessar tasks presas em
            # "queued" sem pod associado (race entre o watcher de pods do
            # scheduler e delete_worker_pods=True em tasks rapidas).
            worker_pods_queued_check_interval: "20"
          dag_processor:
            # Default 30s: reparsear a DAG (Cosmos monta o projeto dbt
            # inteiro) consumia ~0,5 core continuamente. DAG so' muda com
            # imagem nova, e o dag-processor reinicia e parseia na hora.
            min_file_process_interval: "300"
          scheduler:
            # Defaults 600s/120s: reduz o tempo ate detectar e resetar
            # tasks travadas em queued/running sem progresso real
            # (observado com o KubernetesExecutor em tasks curtas e
            # paralelas do dbt/Cosmos — sem isso, o self-heal natural
            # podia levar ate 10 min por task presa).
            task_queued_timeout: "300"
            task_queued_timeout_check_interval: "30"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
