apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18
    helm:
      values: |
        nfs:
          # IP fixo do Service (ver charts/nfs-server/service.yaml), nao
          # o nome DNS: o mount NFS e' feito pelo kubelet no HOST (fora
          # dos pods), que usa o resolver da VPC, nao o CoreDNS — nomes
          # tipo *.svc.cluster.local nao resolvem ali ("Name or service
          # not known"). Reproduzido: nfs-provisioner ficou preso em
          # FailedMount ate trocar pelo IP.
          server: 172.20.211.120
          path: /nfs-storage
        storageClass:
          create: true
          name: nfs-client
          defaultClass: false
          reclaimPolicy: Delete
          archiveOnDelete: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
