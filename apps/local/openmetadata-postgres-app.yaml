apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cicerojmm/treinamentoDataHandsLakehouseOpenSourceAWS
    targetRevision: HEAD
    path: charts/openmetadata
  destination:
    server: https://kubernetes.default.svc
    namespace: governance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
