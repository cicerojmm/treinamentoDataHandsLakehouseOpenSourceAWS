apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: data-platform
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando MinIO ficar disponível..."
              until nc -z minio-local-hl.data-platform.svc.cluster.local 9000; do
                echo "MinIO ainda não está pronto, aguardando..."
                sleep 5
              done
              echo "MinIO está pronto!"
      containers:
        - name: create-buckets
          image: quay.io/minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Configurando alias do MinIO..."
              mc alias set minio http://minio-local-hl.data-platform.svc.cluster.local:9000 minio minio123

              echo "Criando buckets..."
              mc mb minio/bronze --ignore-existing
              mc mb minio/silver --ignore-existing
              mc mb minio/gold --ignore-existing

              echo "Listando buckets criados:"
              mc ls minio/

              echo "Buckets criados com sucesso!"
