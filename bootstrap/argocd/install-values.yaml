server:
  service:
    type: NodePort
    nodePortHttp: 30080

configs:
  params:
    server.insecure: true

controller:
  # 512Mi causava OOMKill ao gerenciar apps com muitos recursos/CRDs grandes
  # (kube-prometheus-stack, openmetadata) simultaneamente no sync inicial
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  # 256Mi causava OOMKill ao gerar manifests de vários charts remotos grandes
  # em paralelo (kube-prometheus-stack, openmetadata, airflow, airbyte, trino)
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false
