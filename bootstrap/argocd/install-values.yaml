server:
  service:
    type: NodePort
    nodePortHttp: 30080

configs:
  params:
    server.insecure: true

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  # 256Mi causava OOMKill ao gerar manifests de vários charts remotos grandes
  # em paralelo (kube-prometheus-stack, openmetadata, airflow, airbyte, trino)
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false
