configs:
  params:
    server.insecure: true

controller:
  # 512Mi causava OOMKill ao gerenciar apps com muitos recursos/CRDs grandes
  # (kube-prometheus-stack, openmetadata) simultaneamente no sync inicial
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

# Service fica ClusterIP (default): nodes em subnet privada, acesso via
# port-forward (make argocd-ui-eks).
server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  # 256Mi causava OOMKill ao gerar manifests de vários charts remotos grandes
  # em paralelo (kube-prometheus-stack, openmetadata, airflow, airbyte, trino)
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Medido em 2026-09-23: ~12Mi, ~3m cpu
redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

notifications:
  enabled: false

dex:
  enabled: false
