kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Airbyte UI
      - containerPort: 30088
        hostPort: 8001
        protocol: TCP
  - role: worker
  - role: worker
