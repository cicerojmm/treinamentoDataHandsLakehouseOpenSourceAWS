movielens:
  target: local
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('DBT_TRINO_HOST', 'trino.data-platform.svc.cluster.local') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('DBT_TRINO_USER', 'admin') }}"
      catalog: iceberg
      schema: default
      threads: 4
